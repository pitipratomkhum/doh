function render(){
 const quiz=document.getElementById("quiz");
 quiz.innerHTML="";
 questions.forEach((q,i)=>{
  let html=`<div class='card'><b>${i+1}. ${q.q}</b>`;
  q.options.forEach((opt,j)=>{
    html+=`<div><input type='radio' name='q${i}' value='${j}'> ${opt}</div>`;
  });
  html+="</div>";
  quiz.innerHTML+=html;
 });
 quiz.innerHTML+=`<button onclick="submitExam()">ส่งคำตอบ</button>`;
}

function submitExam(){
 let score=0;
 questions.forEach((q,i)=>{
  const ans=document.querySelector(`input[name=q${i}]:checked`);
  if(ans && parseInt(ans.value)===q.a) score++;
 });

 const email=localStorage.getItem("user_email");

 // 👉 เก็บลง Google Form (แก้ URL เอง)
 fetch("https://docs.google.com/forms/d/e/XXXX/formResponse",{
  method:"POST",
  mode:"no-cors",
  body:new URLSearchParams({
    "entry.123456":email,
    "entry.654321":score
  })
 });

 document.getElementById("result").innerHTML=
 `<div class='card'><h2>คะแนนของคุณ: ${score}/${questions.length}</h2></div>`;
}
