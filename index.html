<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />

    }

      padding: 12px 20px;

      border-radius: 8px;

    }

      background: #b68b2c;
    }

      top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.6);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999;
    }

    #modal {
      background:white;
      padding:25px;
      border-radius:10px;
      width:300px;
      text-align:center;
    }

    input {
      width:100%;
      padding:10px;
      margin-bottom:10px;
    }

    #result {
      text-align:center;
      margin-top:20px;
      font-size:20px;
      color:#0b3d2e;
    }

    .footer {
      margin-top:50px;
      text-align:center;
    }

    .footer img {

      margin:8px;
    }

    .buy-section {
      margin-top:40px;
      text-align:center;
    }

    .buy-section a {
      display:block;
      margin:10px;
    }

  </style>
</head>

<body>

<h1>นายช่างหยก</h1>
<div class="subtitle">แนวข้อสอบวิศวกรโยธาปฏิบัติการ • กรมทางหลวง</div>

<!-- overlay -->
<div id="overlay">
  <div id="modal">
    <h3>เริ่มทำข้อสอบ</h3>
    <input type="email" id="email" placeholder="กรอกอีเมล">
    <button onclick="unlockExam()">เริ่มสอบ</button>
  </div>
</div>

<div id="quiz"></div>

<div style="text-align:center;">
  <button onclick="submitQuiz()">ส่งคำตอบ</button>
</div>

<div id="result"></div>

<!-- ปุ่มขาย -->
<div class="buy-section">
  <h3>📦 สั่งซื้อแนวข้อสอบ</h3>

  <a href="https://forms.gle/tvCYTiqe3ay66eMs5" target="_blank">
    <button class="primary">แนวข้อสอบเก่ากรมทางหลวง ปี 2566</button>
  </a>

  <a href="https://forms.gle/tvCYTiqe3ay66eMs5" target="_blank">
    <button>สรุปก่อนสอบกรมทางหลวง</button>
  </a>

  <a href="https://forms.gle/cNtvf2GDUSiCvF7V6" target="_blank">
    <button>แนวข้อสอบกรมทางหลวงชนบท</button>
  </a>
</div>

<!-- footer -->
<div class="footer">
  <h3>สนับสนุน / ติดต่อ</h3>

  <img src="images/logo.png">
  <img src="images/line.png">
  <img src="images/donate.png">

  <p>
    Facebook:
    <a href="https://www.facebook.com/EntaneerYok" target="_blank">
      EntaneerYok
    </a>
  </p>
</div>

<script>
let userEmail = "";

function unlockExam(){
  const email = document.getElementById("email").value;
  if(!email){
    alert("กรุณากรอกอีเมล");
    return;
  }
  userEmail = email;
  document.getElementById("overlay").style.display = "none";
}

const questions = [

{q:"ถนนที่ mobility สูงสุดคือ?",options:["Local","Collector","Arterial","Expressway"],answer:3},

{q:"Cross slope โดยทั่วไป?",options:["1%","2%","5%","10%"],answer:1},

{q:"Radius มากขึ้นจะเกิดอะไร?",options:["แคบ","กว้าง","อันตราย","ไม่เปลี่ยน"],answer:1},
{q:"e_max ประมาณ?",options:["0.04","0.06","0.08","0.12"],answer:2},
{q:"Design speed คือ?",options:["เฉลี่ย","ปลอดภัย","สูงสุด","ต่ำสุด"],answer:1},
{q:"Stopping sight distance ขึ้นกับ?",options:["Speed","Time","Friction","ทั้งหมด"],answer:3},

{q:"Minimum radius ขึ้นกับ?",options:["Speed","e","f","ทั้งหมด"],answer:3},
{q:"Shoulder ใช้เพื่อ?",options:["Safety","Parking","Drainage","ทั้งหมด"],answer:3},

{q:"Sight distance สำคัญเพราะ?",options:["Safety","Speed","Cost","Design"],answer:0},
{q:"Alignment ที่ดีต้อง?",options:["สั้น","ตรง","ปลอดภัย","ทั้งหมด"],answer:3},
{q:"Functional classification คือ?",options:["Mobility","Access","ทั้งสอง","None"],answer:2},
{q:"Lane capacity ประมาณ?",options:["1000","2000","3000","4000"],answer:1},

{q:"Bearing capacity คือ?",options:["Soil","Speed","Slope","Load"],answer:0},

{q:"Clay คือ?",options:["Plastic","Rigid","Granular","None"],answer:0},

/* ===== LAW (116–120) ===== */
{q:"พ.ร.บ.ทางหลวงปี?",options:["2525","2535","2545","2555"],answer:1},
{q:"หน่วยงานดูแล?",options:["กรมทางหลวง","โยธา","ขนส่ง","อบต"],answer:0},

const quizDiv = document.getElementById("quiz");

questions.forEach((q,i)=>{
  const div=document.createElement("div");
  div.className="question";
  div.innerHTML = `<p>${i+1}. ${q.q}</p>` +
    q.options.map((opt,idx)=>
      `<label><input type='radio' name='q${i}' value='${idx}'> ${opt}</label><br>`
    ).join("");
  quizDiv.appendChild(div);
});

function submitQuiz(){
  let score=0;
  questions.forEach((q,i)=>{
    const ans=document.querySelector(`input[name=q${i}]:checked`);
    if(ans && parseInt(ans.value)===q.answer) score++;
  });

  document.getElementById("result").innerText =
    `คะแนนของคุณ: ${score}/${questions.length}`;

  // เก็บข้อมูล (Google Sheet)
  fetch("https://script.google.com/macros/s/AKfycbxjV9w1D1z_sZgTb4yy8uDTE0kbLFbthUVYvTYJAK-nmOgjoxxocY22LMoOkjxWpSwv/exec", {
    method:"POST",
    body: JSON.stringify({
      email:userEmail,
      score:score
    })
  });
}
</script>

</html>
