/* ===== RENDER ===== */
function render(){
 const quiz=document.getElementById("quiz");
 quiz.innerHTML="";
 questions.forEach((q,i)=>{
  let html=`<div class='card'><b>${i+1}. ${q.q}</b>`;
  q.options.forEach((opt,j)=>{
    html+=`<div><input type='radio' name='q${i}' value='${j}'> ${opt}</div>`;
  });
  html+="</div>";
  quiz.innerHTML+=html;
 });
}
render();

/* ===== SUBMIT ===== */
function submitExam(){
 const email=document.getElementById("email").value;

 if(!email){
  document.getElementById("result").innerHTML =
  "<div class='card'><b style='color:red'>กรอกอีเมลก่อนดูคะแนน</b></div>";
  return;
 }

 let score=0;
 questions.forEach((q,i)=>{
  const ans=document.querySelector(`input[name=q${i}]:checked`);
  if(ans && parseInt(ans.value)===q.a) score++;
 });

 document.getElementById("result").innerHTML =
 `<div class='card'><h2>คะแนน: ${score}/${questions.length}</h2></div>`;
}
